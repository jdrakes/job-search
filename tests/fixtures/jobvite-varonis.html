<!-- A Jobvite board listing in the list layout: each row is an
     `<li class="row">` wrapped whole in the job link, so the id sits before
     the title. The location element holds two spans, the department then the
     place, and only the place is the location. The link carries a `?nl=1`
     query that is not part of the id. Written from the layout's markup and
     never captured; every id, title and place is invented. -->
<ul class="list-unstyled">
    <li class="row">
        <a href="/margiestravel/job/oCCCCfw3?nl=1">
            <div class="job-item">
                <div class="jv-job-list-name">
                    Detection and Response Engineer
                </div>
                <div class="ml-auto jv-job-list-location">
                    <span>General Administration</span>
                    <span>
                        Springfield, Illinois
                    </span>
                </div>
            </div>
        </a>
    </li>
    <li class="row">
        <a href="/margiestravel/job/oDDDDfw4?nl=1">
            <div class="job-item">
                <div class="jv-job-list-name">
                    Procurement Buyer
                </div>
                <div class="ml-auto jv-job-list-location">
                    <span>Finance</span>
                    <span>
                        Remote, United States
                    </span>
                </div>
            </div>
        </a>
    </li>
</ul>

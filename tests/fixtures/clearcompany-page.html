<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalent &#x2013; Careers</title>
    <meta name="description" content="Escalent Careers">
    <link rel="canonical" href="http://apply.clearcompany.com/escalent">
<meta property="og:title" content="Escalent &#x2013; Careers">
    <meta property="og:description" content="Escalent Careers">
    <meta property="og:image" content="https://cc-client-cdn.clearcompany.com/bca87f32-14a8-91cc-ee28-66257d2b0357/Logo/b3616f4a-07a9-2df4-1c0c-236ffafdf518">
<meta property="og:url" content="http://apply.clearcompany.com/escalent">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="https://careers-content.clearcompany.com/images/clearco-icon.svg">
<style>
:root{--cc-band:#fff;--cc-line:#e3e3e3;--cc-canvas:#eff3f6;--cc-text:#4b5563;--cc-link:#2f5f94;--cc-gutter:24px;--cc-gap:32px}
@media (max-width:767px){:root{--cc-gutter:16px;--cc-gap:20px}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:sans-serif;background:var(--cc-canvas)}
a:focus-visible{outline:2px solid var(--cc-link);outline-offset:2px}
.cc-skip{position:absolute;left:-9999px;top:0;background:#fff;color:var(--cc-link);padding:8px 12px;font-weight:600;z-index:10}
.cc-skip:focus{left:8px;top:8px}
.cc-page{min-height:100vh;display:flex;flex-direction:column}
.cc-wrap{width:min(100% - (2 * var(--cc-gutter)),1120px);margin-inline:auto}
.cc-band{background:var(--cc-band);border-bottom:1px solid var(--cc-line);height:80px}
.cc-band .cc-wrap{height:100%;display:flex;align-items:center}
.cc-logo{height:40px;width:auto;max-width:240px;object-fit:contain;display:block}
.cc-logo[hidden]{display:none}
.cc-main{flex:1 0 auto;padding-block:var(--cc-gap)}
.cc-widget{min-height:400px}
.cc-main-center{display:flex;align-items:center;justify-content:center}
.cc-offline{width:min(520px,100%);background:#fff;border:1px solid var(--cc-line);border-radius:8px;padding:40px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.cc-offline img{width:32px;height:32px;display:block}
.cc-offline-title{margin:0;font-family:"Open Sans",sans-serif;font-weight:700;font-size:22px;line-height:normal;color:#202124}
.cc-offline-text{margin:0;font-family:"Open Sans",sans-serif;font-size:15px;line-height:1.5;color:#595b5d}
.cc-footer{background:var(--cc-band);border-top:1px solid var(--cc-line);min-height:56px;font-family:"Open Sans",sans-serif;font-size:13px;color:var(--cc-text)}
.cc-footer .cc-wrap{min-height:55px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.cc-copy{display:flex;align-items:center;gap:12px;line-height:18px}
.cc-credit{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px}
.cc-divider{color:#c4cdd6}
.cc-home{position:relative;font-weight:600;color:var(--cc-link);text-decoration:none}
.cc-home:hover{text-decoration:underline}
.cc-credit img{height:24px;width:auto;display:block}
.cc-credit a{display:inline-flex;align-items:center;color:#202124;font-weight:700;font-size:14px;text-decoration:none}
.cc-credit-short{display:none}
@media (max-width:767px){
.cc-band{height:64px}
.cc-logo{max-width:160px}
.cc-footer .cc-wrap{flex-direction:column;justify-content:center;gap:4px;padding-block:12px;text-align:center}
.cc-home::after{content:"";position:absolute;inset:-13px -8px}
.cc-credit{margin-left:0}
.cc-credit-full{display:none}
.cc-credit-short{display:inline}
}
</style>
</head>
<body>
<a class="cc-skip" href="#cc-widget">Skip to jobs</a>
<div class="cc-page">
<header class="cc-band">
    <div class="cc-wrap">
        <img class="cc-logo" src="https://cc-client-cdn.clearcompany.com/bca87f32-14a8-91cc-ee28-66257d2b0357/Logo/b3616f4a-07a9-2df4-1c0c-236ffafdf518" alt="Escalent" onerror="this.hidden=true">
    </div>
</header>
<main class="cc-main">
    <div class="cc-wrap cc-widget" id="cc-widget">
            <script src="https://careers-content.clearcompany.com/js/v1/career-site.js" data-site-id="a0345de9-4458-c1d6-a1e2-5568e8f86f13" data-default-source="CJB-0"></script>
    </div>
</main>
<footer class="cc-footer">
    <div class="cc-wrap">
        <div class="cc-copy">
            <span>&copy; 2026 Escalent</span>
            <span class="cc-divider" aria-hidden="true">|</span>
            <a class="cc-home" href="https://escalent.co/" target="_blank" rel="noopener noreferrer">Visit our home page</a>
        </div>
        <div class="cc-credit">
            <span class="cc-credit-full">Applicant tracking system powered by</span>
            <span class="cc-credit-short">Powered by</span>
            <a href="https://www.clearcompany.com" target="_blank" rel="noopener noreferrer">
                <img src="https://careers-content.clearcompany.com/images/clearco-logo.svg" alt="ClearCo">
            </a>
        </div>
    </div>
</footer>
</div>
</body>
</html>
